version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "typescript"
      development-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "typescript"

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
          - "typescript"
      development-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "typescript"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5